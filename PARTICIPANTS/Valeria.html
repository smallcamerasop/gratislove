<script>
  document.addEventListener('DOMContentLoaded', () => {
    const box = document.getElementById('dragBox');
    const handle = document.getElementById('rotateHandle');
    if (!box || !handle) return;

    let angle = 40;

    const setInitialPosition = () => {
      const rect = box.getBoundingClientRect();
      const centerX = window.innerWidth * 0.72;
      const centerY = window.innerHeight / 2;
      box.style.left = (centerX - rect.width / 2) + 'px';
      box.style.top = (centerY - rect.height / 2) + 'px';
    };

    box.style.transform = `rotate(${angle}deg)`;
    setInitialPosition();

    let dragging = false;
    let rotating = false;
    let offsetX = 0;
    let offsetY = 0;

    box.addEventListener('mousedown', (e) => {
      dragging = true;
      box.classList.add('dragging');
      const rect = box.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      e.preventDefault();
    });

    handle.addEventListener('mousedown', (e) => {
      rotating = true;
      e.stopPropagation();
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (dragging) {
        box.style.left = (e.clientX - offsetX) + 'px';
        box.style.top = (e.clientY - offsetY) + 'px';
      } else if (rotating) {
        const rect = box.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        angle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI + 90;
        box.style.transform = `rotate(${angle}deg)`;
      }
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
      rotating = false;
      box.classList.remove('dragging');
    });
  });
</script>

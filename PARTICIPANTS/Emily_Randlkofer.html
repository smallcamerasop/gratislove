  /* 圖片區域：底部預留圓點的空間，圖片在區域內上下置中 */
  .slideshow-images {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 32px;
    cursor: url('../img/cursor-pointer.png'), pointer;
  }
  .slideshow-images img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
  }
  .slideshow-images img.active {
    opacity: 1;
  }
  /* 圓點的垂直位置由 JS 依目前圖片實際顯示的底邊計算 */

    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 9px;
  }
  .slideshow-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1px solid black;
    cursor: url('../img/cursor-pointer.png'), pointer;

<script src="../lightbox.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const slides = document.querySelectorAll('.slideshow-images img');
    const imagesEl = document.querySelector('.slideshow-images');
    const dotsEl = document.querySelector('.slideshow-dots');
    if (!slides.length) return;

    let current = 0;

    // 每張圖一個圓點
    const dots = Array.from(slides, (_, i) => {
      const dot = document.createElement('span');
      dot.className = 'slideshow-dot';
      dot.addEventListener('click', () => showSlide(i));
      dotsEl.appendChild(dot);
      return dot;
    });

    function showSlide(index) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (index + slides.length) % slides.length;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
      placeDots();
    }

    // 圓點固定在「最高那張圖」（直式的 01-2 ~ 01-4）實際顯示範圍的底邊下方 14px，
    // 換到較矮的橫圖時圓點不跟著移動
    const DOT_GAP = 14;
    function placeDots() {
      const boxW = imagesEl.clientWidth;
      const boxH = imagesEl.clientHeight;
      let shownH = 0;
      slides.forEach(img => {
        if (!img.naturalWidth) return;
        shownH = Math.max(shownH, Math.min(boxH, boxW * img.naturalHeight / img.naturalWidth));
      });
      if (!shownH) return;
      dotsEl.style.top = ((boxH + shownH) / 2 + DOT_GAP) + 'px';
    }
    slides.forEach(img => img.addEventListener('load', placeDots));
    window.addEventListener('resize', placeDots);

    if (imagesEl) imagesEl.addEventListener('click', () => showSlide(current + 1));

    showSlide(0);
  });
</script>

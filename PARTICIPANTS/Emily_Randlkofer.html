    width: 100%;
    height: 100%;

    transition: opacity 0.8s ease;
  }
  .slideshow-images img.active {

  }
  .slideshow-progress {

    background: #ddd;
    cursor: url('../img/cursor-pointer.png'), pointer;
  }
  .slideshow-progress-fill {
    height: 100%;
    width: 0%;
    background: black;
    transition: width 0.3s ease;
  }

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const slides = document.querySelectorAll('.slideshow-images img');
    const imagesEl = document.querySelector('.slideshow-images');
    const progressBar = document.querySelector('.slideshow-progress');
    const progressFill = document.querySelector('.slideshow-progress-fill');
    if (!slides.length) return;

    let current = 0;

    function updateProgress() {
      if (progressFill) {
        progressFill.style.width = ((current + 1) / slides.length * 100) + '%';
      }
    }

    function showSlide(index) {
      slides[current].classList.remove('active');
      current = (index + slides.length) % slides.length;
      slides[current].classList.add('active');
      updateProgress();
    }

    function nextSlide() {
      showSlide(current + 1);
    }

    if (imagesEl) imagesEl.addEventListener('click', nextSlide);
    if (progressBar) progressBar.addEventListener('click', nextSlide);

    updateProgress();
  });
</script>
